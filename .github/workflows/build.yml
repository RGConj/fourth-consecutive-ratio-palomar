name: Lean build and axiom audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: "2"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free unused hosted-runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 20971520
      - name: Check source integrity
        run: python3 scripts/check_sources.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake
          key: lean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lean-comparator-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build the full development
        run: lake build
      - name: Validate submission metadata and dependency pins
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
          python3 scripts/check_metadata.py
      - name: Reject every nonstandard axiom
        run: |
          set -euo pipefail
          for gate in scripts/Check*Axioms.lean; do
            lake env lean "$gate"
          done
